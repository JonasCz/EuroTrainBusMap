name: Check Cloudflare credentials
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/check-cloudflare.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets present
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$T" ] && echo "CLOUDFLARE_API_TOKEN: set (${#T} chars)" || echo "CLOUDFLARE_API_TOKEN: MISSING"
          [ -n "$A" ] && echo "CLOUDFLARE_ACCOUNT_ID: set (${#A} chars)" || echo "CLOUDFLARE_ACCOUNT_ID: MISSING"
      - name: Verify token
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | jq '{success, status: .result.status, errors}'
          curl -sS -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/tokens/verify" | jq '{success, status: .result.status, errors}'
          echo "--- workers scripts"
          curl -sS -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts" | jq '{success, errors, count: (.result|length?)}'
          echo "--- workers.dev subdomain"
          curl -sS -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain" | jq '{success, errors, subdomain: .result.subdomain}'
          echo "--- r2 buckets"
          curl -sS -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/r2/buckets" | jq '{success, errors}'
      - name: wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 whoami
