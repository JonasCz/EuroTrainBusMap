name: Build data & deploy

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/build-deploy.yml"
  schedule:
    # Mondays 03:17 UTC: weekly data refresh
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      subset:
        description: "Data subset to build"
        type: choice
        options: [full, core]
        default: full
      rebuild:
        description: "Rebuild data even on a push-style run (ignored for schedule)"
        type: boolean
        default: true

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  WORK: ${{ github.workspace }}/work
  BASE_PATH: ${{ vars.BASE_PATH || '/' }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Decide whether to rebuild data
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"; echo "subset=full" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rebuild=${{ inputs.rebuild }}" >> "$GITHUB_OUTPUT"; echo "subset=${{ inputs.subset }}" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"; echo "subset=full" >> "$GITHUB_OUTPUT"
          fi
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Latest successfully built data (restored on every run; push builds just redeploy it).
      - name: Restore built data
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: work/out
          key: data-out-${{ github.run_id }}
          restore-keys: data-out-

      - name: Check restored data
        id: have
        run: |
          if [ -f work/out/manifest.json ]; then echo "data=true" >> "$GITHUB_OUTPUT"; cat work/out/manifest.json; echo; else echo "data=false" >> "$GITHUB_OUTPUT"; fi

      # Small, slow-changing downloads (GeoNames, Natural Earth, Overture rail extract) – keyed by ISO week.
      - name: Restore ETL download cache
        if: steps.mode.outputs.rebuild == 'true' || steps.have.outputs.data != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            work/cache/geonames
            work/cache/basemap
            work/geometry
          key: etl-cache-${{ steps.mode.outputs.week }}
          restore-keys: etl-cache-

      - name: Build data
        if: steps.mode.outputs.rebuild == 'true' || steps.have.outputs.data != 'true'
        run: |
          # The runner may export AWS credentials; DuckDB must access the public Overture bucket anonymously.
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE AWS_DEFAULT_REGION AWS_REGION
          rm -rf work/out-new
          pnpm --filter @etbm/etl run build-data -- --out "$WORK/out-new" --work "$WORK" --subset "${{ steps.mode.outputs.subset }}"
          rm -rf work/out && mv work/out-new work/out
          rm -f work/etl.duckdb work/etl.duckdb.wal
          rm -rf work/cache/feeds work/tmp
          df -h /
          du -sh work/out
          find work/out -type f | wc -l

      - name: Build report
        if: always()
        run: |
          [ -f work/out/build-report.json ] && node -e '
            const r = require(process.argv[1]);
            console.log(JSON.stringify({ build: r.build, stats: r.stats, stageSeconds: r.stageSeconds, sanity: r.sanity && { errors: r.sanity.errors, warnings: r.sanity.warnings } }, null, 1));
          ' "$PWD/work/out/build-report.json" || echo "no build report"

      - name: Save ETL download cache
        if: steps.mode.outputs.rebuild == 'true' || steps.have.outputs.data != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            work/cache/geonames
            work/cache/basemap
            work/geometry
          key: etl-cache-${{ steps.mode.outputs.week }}-${{ github.run_id }}

      - name: Save built data
        if: steps.mode.outputs.rebuild == 'true' || steps.have.outputs.data != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/out
          key: data-out-${{ github.run_id }}

      - name: Build web
        run: pnpm --filter @etbm/web build

      - name: Assemble site
        run: |
          base="${BASE_PATH#/}"; base="${base%/}"
          site="dist/site"; target="$site${base:+/$base}"
          rm -rf "$site" && mkdir -p "$target"
          cp -r packages/web/dist/. "$target/"
          rm -rf "$target/data"
          mkdir -p "$target/data"
          cp -r work/out/. "$target/data/"
          rm -f "$target/data/build-report.json"
          echo "files: $(find "$site" -type f | wc -l)"; du -sh "$site"
          # Cloudflare static assets: max 25 MiB per file
          big=$(find "$site" -type f -size +25M); if [ -n "$big" ]; then echo "Files over 25 MiB:"; echo "$big"; exit 1; fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy
